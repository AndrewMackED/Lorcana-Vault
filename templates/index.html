<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorcana Vault Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #webcam-container canvas {
            border-radius: 15px;
            border: 5px solid #333;
        }

        #card-img {
            display: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">✨ Lorcana Vault Scanner</h1>

        <div class="row">
            <div class="col-md-6 text-center">
                <div class="card p-3 shadow-sm">
                    <button class="btn btn-primary btn-lg mb-3" onclick="init()">Start Scanner</button>
                    <div id="webcam-container"></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 shadow-sm h-100 border-0">
                    <div class="d-flex justify-content-between align-items-start">
                        <h2 id="card-name" class="h3">Awaiting Scan...</h2>
                        <span id="card-cost" class="badge rounded-circle bg-dark p-3">0</span>
                    </div>
            
                    <div id="card-types" class="mb-3">
                    </div>
            
                    <hr>
            
                    <div class="row text-center mb-3">
                        <div class="col-4">
                            <small class="text-muted d-block">INK</small>
                            <strong id="card-ink">-</strong>
                        </div>
                        <div class="col-4">
                            <small class="text-muted d-block">STR/WILL</small>
                            <strong id="card-stats">- / -</strong>
                        </div>
                        <div class="col-4">
                            <small class="text-muted d-block">LORE</small>
                            <strong id="card-lore" class="text-warning"></strong>
                        </div>
                    </div>
            
                    <div class="text-center">
                        <img id="card-img" src="" alt="Card Image" class="img-fluid rounded shadow d-block mx-auto"
                            style="max-height: 400px; display:none;">
                    </div>
            
                    <button class="btn btn-outline-danger btn-sm mt-4" onclick="resetScanner()">Reset Scanner</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="/static/js/scanner.js"></script>
</body>

</html>
